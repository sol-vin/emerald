id: "VideoPlayer3D"
title: "EmeraldVideoPlayer3D (3D In-World Node)"
summary: "Godot Node3D for rendering video on 3D television sets, cinema displays, and billboards."
track: "nodes"

sections:
  - id: "overview"
    title: "Overview"
    summary: "Introduction to EmeraldVideoPlayer3D node."
    content: |
      `EmeraldVideoPlayer3D` extends `Node3D` to bring LibVLC video playback into 3D game environments. It manages an `ImageTexture` that can either be rendered automatically via an attached `Sprite3D` or mapped onto any 3D mesh material (`StandardMaterial3D.albedo_texture`).

  - id: "mapping_to_materials"
    title: "Mapping onto 3D Mesh Materials"
    summary: "Binding dynamic video textures to 3D materials."
    content: |
      ```crystal
      node InGameCinemaScreen < Node3D do
        def _ready : Void
          # Create 3D player without internal Sprite3D
          player = EmeraldVideoPlayer3D.new
          player.create_sprite3d = false
          player.source = "res://videos/security_feed.mp4"
          player.loop = true
          player.play
          add_child(player)

          # Assign player's dynamic video texture to mesh material
          mesh_node = get_node_as(Godot::MeshInstance3D, "ScreenMesh")
          if mat = mesh_node.get_active_material(0).as?(Godot::StandardMaterial3D)
            mat.albedo_texture = player.video_texture
          end
        end
      end
      ```
